name: Daylog Auto Publisher (daylog.bestwellth.org)
# 매일 자동 실행은 Claude Code 루틴으로 대체됨 (사실 검증을 직접 하면서 콘텐츠를 작성하기 위함).
# 이 워크플로는 수동 실행(workflow_dispatch)용으로만 남겨둠.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0
      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 반복일정 자동 초안 생성 실행
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          DAYLOG_WP_SITE_URL:     ${{ secrets.DAYLOG_WP_SITE_URL }}
          DAYLOG_WP_USERNAME:     ${{ secrets.DAYLOG_WP_USERNAME }}
          DAYLOG_WP_APP_PASSWORD: ${{ secrets.DAYLOG_WP_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daylog_auto_publisher.py
      - name: 마지막발행연도 갱신 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar_schema.json
          git diff --staged --quiet || git commit -m "chore: update last_published_year [skip ci]"
          git pull --rebase origin main
          git push origin main
